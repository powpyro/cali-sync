<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Wave Cyan Gradient -->
    <linearGradient id="caliCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1DC4FF" />
      <stop offset="100%" stopColor="#0088CC" />
    </linearGradient>

    <!-- Deep Slate Navy Gradient -->
    <linearGradient id="caliNavyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0F172A" />
      <stop offset="100%" stopColor="#334155" />
    </linearGradient>
  </defs>

  <!-- Background Rounded Tile -->
  <rect
    x="2"
    y="2"
    width="60"
    height="60"
    rx="18"
    fill="#0F172A"
    stroke="#1E293B"
    stroke-width="2"
  />

  <!-- Left Wave Arc (Evaluation Input Wave) -->
  <path
    d="M20 22C14 26 14 38 20 42"
    stroke="#64748B"
    stroke-width="3.5"
    stroke-linecap="round"
  />
  <path
    d="M26 16C16 23 16 41 26 48"
    stroke="#475569"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-dasharray="1 3"
  />

  <!-- Right Wave Arc (Gauge Reference Wave) -->
  <path
    d="M44 22C50 26 50 38 44 42"
    stroke="url(#caliCyanGrad)"
    stroke-width="3.5"
    stroke-linecap="round"
  />
  <path
    d="M38 16C48 23 48 41 38 48"
    stroke="url(#caliCyanGrad)"
    stroke-width="2.5"
    stroke-linecap="round"
    opacity="0.75"
  />

  <!-- Central Convergence Alignment Nodes (Sync Infinity Loop) -->
  <path
    d="M24 32C24 28 28 26 32 32C36 38 40 36 40 32C40 28 36 26 32 32C28 38 24 36 24 32Z"
    stroke="url(#caliCyanGrad)"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Central Target Focal Point -->
  <circle
    cx="32"
    cy="32"
    r="3.5"
    fill="#1DC4FF"
  />
  <circle
    cx="32"
    cy="32"
    r="7"
    stroke="#1DC4FF"
    stroke-width="1"
    stroke-dasharray="2 2"
    opacity="0.6"
  />
</svg>
